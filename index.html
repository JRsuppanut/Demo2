<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Web Management Suite (Demo 2)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #F3F4F6;
            margin: 0;
            padding: 2rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #FFFFFF;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .header {
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #E5E7EB;
            padding-bottom: 1rem;
        }
        .controls {
            margin-bottom: 1.5rem;
            display: flex;
            gap: 1rem;
        }
        button {
            padding: 0.5rem 1rem;
            font-size: 1rem;
            font-weight: 600;
            color: #FFFFFF;
            background-color: #2563EB;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #1D4ED8; }
        button:disabled { background-color: #9CA3AF; cursor: not-allowed; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.5rem;
        }
        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid #E5E7EB;
        }
        th { background-color: #F9FAFB; font-weight: 600; }
        .log-console {
            background-color: #1F2937;
            color: #10B981;
            padding: 1rem;
            height: 200px;
            overflow-y: auto;
            font-family: 'Consolas', monospace;
            font-size: 0.875rem;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>NFC Web Application Interface</h2>
            <p>Utilizing Web Serial API for PN532 UART Communication</p>
        </div>

        <div class="controls">
            <button id="btn-connect">Connect Reader</button>
            <button id="btn-detect" disabled>Detect TAG</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Target ID</th>
                    <th>UID</th>
                    <th>Standard</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr>
                    <td colspan="3" style="text-align: center; color: #6B7280;">No tags detected.</td>
                </tr>
            </tbody>
        </table>

        <div class="log-console" id="log-console">
            System Initialized. Awaiting hardware connection...<br>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
