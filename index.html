<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Web Application Interface</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; }
        .panel { border: 1px solid #ddd; padding: 20px; margin-bottom: 20px; border-radius: 5px; background-color: #f9f9f9; }
        .console { background-color: #1e1e1e; color: #4af626; font-family: monospace; padding: 15px; height: 250px; overflow-y: auto; border-radius: 3px; font-size: 14px; }
        button { padding: 10px 15px; margin-right: 10px; cursor: pointer; border: none; background-color: #0056b3; color: white; border-radius: 3px; font-weight: bold; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        input[type="text"] { padding: 8px; width: 150px; margin-right: 10px; border: 1px solid #ccc; border-radius: 3px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background-color: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #e9ecef; }
        hr { border: 0; border-top: 1px solid #ddd; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h2>NFC Web Application Interface</h2>
        
        <div class="panel">
            <h4>Hardware Connection</h4>
            <button id="btnConnect">Connect Reader</button>
            <button id="btnRead" disabled>Read Tag</button>
        </div>

        <div class="panel">
            <h4>NFC Data Writer (NTAG2xx Series)</h4>
            <label for="inputData">Data (Exactly 4 chars):</label>
            <input type="text" id="inputData" maxlength="4" placeholder="TEXT">
            <button id="btnWrite" disabled>Write to Tag</button>
        </div>

        <div class="panel">
            <h4>Target Information</h4>
            <table>
                <thead>
                    <tr>
                        <th>Target ID</th>
                        <th>UID (Hex)</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tagTableBody">
                    <tr>
                        <td colspan="3">No tag detected. Please connect the reader and scan.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="panel">
            <h4>System Log</h4>
            <div id="logConsole" class="console"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
